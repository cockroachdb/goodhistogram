name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - "1.23"
          - "1.24"
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go (${{ matrix.go }})
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}

    - name: Build (${{ matrix.go }})
      run: go build ./...

    - name: Vet (${{ matrix.go }})
      run: go vet ./...

    - name: Test (${{ matrix.go }})
      run: go test ./...

    - name: Tidy (${{ matrix.go }})
      run: go mod tidy

  # The Rust crate lives in rust/. Its conformance test replays datatest/*.txt
  # (generated from the Go implementation), so this job fails if the Rust port
  # drifts from Go.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Format
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Clippy (all features)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Test (default, zero-dependency)
      run: cargo test --verbose

    - name: Test (all features)
      run: cargo test --all-features --verbose
